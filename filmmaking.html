<head>

  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e0dcd4; font-family: 'DM Mono', monospace; font-weight: 300; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: baseline; padding: 3rem 4rem 0; }
    .nav-name { font-family: 'DM Mono', monospace; font-weight: 300; font-size: 0.7rem; letter-spacing: 0.1em; color: #e0dcd4; text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { font-family: 'DM Mono', monospace; font-weight: 300; font-size: 0.65rem; letter-spacing: 0.12em; text-decoration: none; color: #5a5650; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #e0dcd4; }

    main { padding: 7rem 4rem 6rem; max-width: 640px; }
    h1 { font-family: 'Special Elite', monospace; font-size: clamp(2.5rem, 6vw, 5rem); line-height: 1; margin-bottom: 2rem; letter-spacing: 0.01em; }
    .coming { font-size: 0.82rem; color: #5a5650; line-height: 2; font-style: italic; }
    .back { display: inline-block; margin-top: 3rem; font-size: 0.62rem; letter-spacing: 0.12em; color: #5a5650; text-decoration: none; transition: color 0.2s; }
    .back:hover { color: #e0dcd4; }

    footer { padding: 3rem 4rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; margin-top: 4rem; }
    .footer-copy { font-size: 0.55rem; letter-spacing: 0.08em; color: #2e2e2e; }
    .footer-links { display: flex; gap: 2rem; }
    .footer-links a { font-size: 0.55rem; letter-spacing: 0.1em; color: #2e2e2e; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #e0dcd4; }

    @media (max-width: 700px) {
      nav { padding: 2rem 2rem 0; flex-direction: column; gap: 1.5rem; }
      .nav-links { gap: 1.5rem; }
      main { padding: 5rem 2rem 4rem; }
      footer { padding: 2rem; flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-name">Armaan</a>
    <ul class="nav-links">
      <li><a href="/">About</a></li>
      <li><a href="/writing">Writing</a></li>
      <li><a href="/photography">Photography</a></li>
      <li><a href="/filmmaking" class="active">Filmmaking</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </nav>
  <main>
    <h1>Filmmaking</h1>
    <p class="coming">Something is in the works. This space will soon hold films, short documentaries, and moving image work.</p>
    <a href="/" class="back">← Back to home</a>
  </main>
  <footer>
    <span class="footer-copy">© 2026 Armaan</span>
    <div class="footer-links"><a href="#">Instagram</a><a href="#">Twitter</a><a href="#">LinkedIn</a></div>
