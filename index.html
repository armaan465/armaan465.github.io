<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Armaan</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; color: #e0dcd4;
      font-family: 'DM Mono', monospace; font-weight: 300;
      min-height: 100vh;
    }

    nav {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 3rem 4rem 0;
    }
    .nav-name {
      font-family: 'DM Mono', monospace; font-weight: 300;
      font-size: 0.7rem; letter-spacing: 0.1em; color: #e0dcd4;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-family: 'DM Mono', monospace; font-weight: 300;
      font-size: 0.65rem; letter-spacing: 0.12em;
      text-decoration: none; color: #5a5650; transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: #e0dcd4; }

    main { padding: 8rem 4rem 6rem; max-width: 780px; }

    .name {
      font-family: 'Special Elite', monospace;
      font-size: clamp(3.5rem, 8vw, 6.5rem);
      line-height: 1; letter-spacing: 0.01em;
      margin-bottom: 1.5rem;
    }

    .roles {
      font-family: 'DM Mono', monospace; font-weight: 300;
      font-size: 0.72rem; letter-spacing: 0.1em;
      color: #5a5650; margin-bottom: 4rem;
    }
    .roles span { margin: 0 0.6rem; }
    .roles span:first-child { margin-left: 0; }

    .bio {
      font-family: 'DM Mono', monospace; font-weight: 300;
      font-size: 0.85rem; line-height: 2.1; color: #9a9488;
      max-width: 560px;
    }
    .bio p + p { margin-top: 1.4rem; }

    footer {
      padding: 3rem 4rem;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #1a1a1a;
      margin-top: 8rem;
    }
    .footer-copy {
      font-family: 'DM Mono', monospace; font-weight: 300;
      font-size: 0.55rem; letter-spacing: 0.08em; color: #2e2e2e;
    }
    .footer-links { display: flex; gap: 2rem; }
    .footer-links a {
      font-family: 'DM Mono', monospace; font-weight: 300;
      font-size: 0.55rem; letter-spacing: 0.1em;
      color: #2e2e2e; text-decoration: none; transition: color 0.2s;
    }
    .footer-links a:hover { color: #e0dcd4; }

    @media (max-width: 700px) {
      nav { padding: 2rem 2rem 0; flex-direction: column; gap: 1.5rem; }
      .nav-links { gap: 1.5rem; }
      main { padding: 5rem 2rem 4rem; }
      footer { padding: 2rem; flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-name">Armaan</a>
    <ul class="nav-links">
      <li><a href="/" class="active">About</a></li>
      <li><a href="/writing">Writing</a></li>
      <li><a href="/photography">Photography</a></li>
      <li><a href="/filmmaking">Filmmaking</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h1 class="name">Armaan</h1>
    <p class="roles">Writer<span>·</span>Photographer<span>·</span>Filmmaker</p>
    <div class="bio">
      <p><!-- Your bio goes here --></p>
    </div>
  </main>

  <footer>
    <span class="footer-copy">© 2026 Armaan</span>
    <div class="footer-links">
      <a href="#">Instagram</a>
      <a href="#">Twitter</a>
      <a href="#">LinkedIn</a>
    </div>
  </footer>

</body>
</html>
